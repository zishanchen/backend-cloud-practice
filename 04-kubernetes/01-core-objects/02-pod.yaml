apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo-pod
  labels:
    app: nginx-pod-demo

spec:
  containers:
    - name: nginx
      image: nginx:alpine

      ports:
        - containerPort: 80

      volumeMounts:
        - name: config-volume
          mountPath: /usr/share/nginx/html

  volumes:
    - name: config-volume
      configMap:
        name: nginx-demo-config